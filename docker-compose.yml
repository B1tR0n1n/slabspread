services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes: [".:/srv"]
  workers:
    build: .
    command: python -m ingest.scheduler   # arrives in Phase 2
    env_file: .env
    volumes: [".:/srv"]
    profiles: ["workers"]
