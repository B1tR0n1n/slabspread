[project]
name = "slabspread"
version = "0.1.0"
description = "Market intelligence for vaulted graded trading cards."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "apscheduler>=3.10,<4",
    "pycryptodome>=3.20",
    "pyjwt>=2.8",
    "itsdangerous>=2.2",
    "markdown>=3.6",
    "stripe>=10.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engines", "ingest", "models", "config", "sitegen"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["B008"]            # FastAPI Depends()/Form() in defaults is the framework idiom
"tests/gen_corpus.py" = ["E501"]  # data tables read better on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
