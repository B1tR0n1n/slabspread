<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SlabSpread{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"></script>
<style>
:root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e8ee; --dim:#8b93a7; --ok:#3ddc97; --bad:#ff6b6b; --acc:#7aa2f7; --warn:#f7c96b }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; }
header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap }
header a { color:var(--acc); text-decoration:none }
header form { margin-left:auto }
main { padding:16px; max-width:1280px; margin:0 auto }
table { width:100%; border-collapse:collapse }
th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top }
th { color:var(--dim); font-weight:normal }
td.num, th.num { text-align:right; font-variant-numeric:tabular-nums }
.dim { color:var(--dim) } .ok { color:var(--ok) } .bad { color:var(--bad) } .warn { color:var(--warn) }
.conf { font-weight:bold }
button, input[type=submit] { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:4px 10px; cursor:pointer; font:inherit }
button.ok { border-color:var(--ok); color:var(--ok) } button.bad { border-color:var(--bad); color:var(--bad) }
input, select, textarea { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:4px 6px; font:inherit }
label { display:block; margin:8px 0 2px; color:var(--dim) }
code, pre { color:var(--dim); font-size:12px; white-space:pre-wrap }
details summary { cursor:pointer; color:var(--dim) }
.tabs a { margin-right:12px } .tabs a.on { text-decoration:underline }
.panel { background:var(--panel); border:1px solid var(--line); padding:12px; margin:12px 0 }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px }
footer { padding:16px; color:var(--dim); border-top:1px solid var(--line); text-align:center; font-size:12px }
</style>
</head>
<body>
<header>
  <strong><a href="/">SlabSpread</a></strong>
  <a href="/">opportunities</a> <a href="/alerts">alerts</a> <a href="/lag">lag</a> <a href="/packs">packs</a>
  <a href="/ledger">ledger</a> <a href="/admin/matches">match review</a> <a href="/admin/odds">odds snapshot</a> <a href="/health/ingest">ingest</a>
  <form method="post" action="/logout"><button>logout</button></form>
</header>
<main>{% block body %}{% endblock %}</main>
<footer>Private tool. Nothing here is financial advice. No trades are executed by this software — a human clicks buy.</footer>
</body>
</html>
